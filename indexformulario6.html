<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>
    <form action="index5.html" method="post"></form>
    <label for="nomeCompleto">Nome Completo</label>
    <input type="text" id="nomeCompleto" name="nomeCompleto">

    <label>
        E-mail
        <input type="email" name="emailDoUsuário">
    </label>
    <label for="dataNascimento">Data de Nascimento</label>
    <input type="date" id="dataNascimento" name="dataNascimento">
    <label for="idade">Idade</label>
    <input type="number" id="Idade" name="Idade">
    <label for="Senha">Senha</label>
    <input type="password" id="Senha" name="Senha">
    <label for="curriculo">Currículo</label>
    <input type="file" id="curriculo" name="curriculo" accept=".pdf">
    <label for="range">range</label>
    <input type="range" min="0" max="10" step="2" id="range" name="range">
    <br>
    <!--Checkbox-->
    <p>quais tecnologias você conhece?</p>
    <label>
        <input type="checkbox" name="tecnologia" value="html">HTML</label>
    <label>
        <input type="checkbox" name="tecnologia" value="CSS">CSS
    </label>
    <label>
        <input type="checkbox" name="tecnologia" value="javascript">javascript
    </label>
    <p>Qual o seu turno de estudo?</p>
    <label>
        <input type="radio" name="turno" value="manha">Manhã
    </label>
    <label>
        <input type="radio" name="turno" value="tarde">Tarde
    </label>
    <label>
        <input type="radio" name="turno" value="noite">Noite
    </label>
<label for="Curso">Curso</label>
<select id="Curso" name="Curso">
    <option value="">Selecione...</option>
    <option value="informatica">Informática</option>
    <optgroup><label for="Gestão">
        <option value="adm">Administração</option>
        <option value="contabeis">Ciências Contábeis</option>
    </optgroup>    

</select>
<label for="cidade"></label>
<input list="cidades" id="cidade" name="cidade">
<datalist id="cidades">
    <option value="Chapecó"></option>
    <option value="Joinville"></option>
    <option value="Florianópolis"></option>
</datalist>
<form>
<fieldset>
    <legend>Dados Básicos</legend>
    <label for="nomeCompleto">Nome Completo</label>
    <input type="text" id="nomeCompleto" name="nomeCompleto">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email">
</fieldset>
<br>
<label for="cep">CEP</label>
<input type="text" id="cep" name="cep"
pattern="[0-9]{5}-[0-9]{3}"
placeholder="00000-000"
title="Formato: 00000-000"
required>
<textarea id="mensagem" name="mensagem" rows="5" cols="40"
minlength="3" maxlength="500"></textarea>
<label for="numero">Número</label>
<input type="number" id="numero" name="numero" min="1" max="10">
<label for="campoOculto">Campo Oculto</label>
<input type="text" id="campoOculto" name="campoOculto" readonly>
<label for="desabilitado">Campo desabilitado</label>
<input type="text" id="desabilitado" name="desabilitado" disabled>
<label for="email">E-mail</label>
<input type="email" id="email" name="email" autocomplete="email">
<button type="submit">Enviar</button>
<button type="reset">Limpar</button>
</form>
</body>
</html>
