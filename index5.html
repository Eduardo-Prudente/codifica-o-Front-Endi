<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
</head>
<body>
    <table>
        <caption>Horários das aulas da semana</caption><!--Título da Tablea-->
        <thead> <!--Cabeçalho da Tabela-->
            <TR> <!--Linha da tabela-->
                <th scope="col">Dia da Semana</th>
                <th scope="col">Unidade curricular</th>
                <th scope="col">Horário</th>
            </TR>
        </thead>
        <tbody>
            <tr>
                <td>Segunda-Feira</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Terça-feira</td>
                <td>codificação Front-End</td>
                <td>14:00 ás 17:00</td>
            </tr>
        </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Intervalo: 15:15 ás 15:30</td>
                </tr>
            </tfoot>
    </table>
</body>
</html>
